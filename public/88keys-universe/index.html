<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>八十八鍵の宇宙 — The Universe of 88 Keys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#05060f;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",Roboto,Helvetica,Arial,sans-serif;
  color:#e8ecff;-webkit-font-smoothing:antialiased;user-select:none;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(96,74,220,.34), transparent 62%),
    radial-gradient(900px 620px at 92% 8%, rgba(24,120,190,.22), transparent 60%),
    radial-gradient(1200px 800px at 60% 118%, rgba(190,60,150,.16), transparent 62%),
    linear-gradient(178deg,#0a0c1e 0%,#070818 46%,#04050e 100%);
}
#stars,#stars2,#stars3{position:fixed;top:0;left:0;width:1px;height:1px;border-radius:50%;z-index:1;pointer-events:none;}
#stars{animation:drift 240s linear infinite}
#stars2{animation:drift 420s linear infinite}
#stars3{animation:twinkle 9s ease-in-out infinite}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-60px,40px,0)}}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}

#app{position:fixed;inset:0;z-index:2;display:grid;
  grid-template-columns:minmax(0,1fr) clamp(300px,34vw,560px);
  grid-template-rows:minmax(0,1fr) 64px;
  gap:0;
}
#pianoPane{grid-column:1;grid-row:1;position:relative;min-width:0;min-height:0;overflow:hidden}
#drumPane{grid-column:2;grid-row:1;position:relative;min-width:0;min-height:0;overflow:hidden;
  border-left:1px solid rgba(120,160,255,.10);
  background:linear-gradient(180deg,rgba(10,14,34,.55),rgba(6,8,20,.15));}
#bar{grid-column:1/-1;grid-row:2;position:relative;z-index:6;display:flex;align-items:center;gap:10px;
  padding:0 12px;min-width:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(12,15,34,.92),rgba(6,8,20,.98));
  border-top:1px solid rgba(120,160,255,.13);
  box-shadow:0 -14px 40px rgba(0,0,0,.5);
}
#roll{position:absolute;left:0;right:0;top:0;display:block}
#keys{position:absolute;left:0;right:0;bottom:0;display:block}
#rollFade{position:absolute;left:0;right:0;top:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,6,15,.85),rgba(5,6,15,0) 34%);}
#hitGlow{position:absolute;left:0;right:0;pointer-events:none;opacity:.85;
  background:linear-gradient(0deg,rgba(255,196,110,.16),rgba(255,196,110,0));}

#hud{position:absolute;left:26px;top:20px;z-index:5;pointer-events:none;max-width:min(62%,760px);
  isolation:isolate;padding:2px 0}
#secJp{display:block;font-size:13px;letter-spacing:.30em;color:#9fb2e6;text-transform:uppercase}
#secEn{display:block;font-size:26px;font-weight:700;letter-spacing:.02em;color:#f2f5ff;
  text-shadow:0 2px 26px rgba(120,150,255,.5)}
#chordRow{display:flex;align-items:flex-end;gap:16px;margin-top:6px}
#chord{font-size:64px;line-height:.94;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff3d0,#ffc46e 55%,#e08c2a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(255,170,70,.35));transition:opacity .18s}
#chordQ{font-size:14px;color:#c9b189;letter-spacing:.18em;text-transform:uppercase;padding-bottom:6px}
#beatDots{display:flex;gap:9px;margin-top:14px;margin-bottom:2px;align-items:center}
#beatDots i{width:11px;height:11px;border-radius:50%;background:rgba(150,175,255,.20);
  box-shadow:inset 0 0 0 1px rgba(160,190,255,.25);display:block;transition:background .09s,transform .09s,box-shadow .09s}
#beatDots i.on{background:#ffd489;transform:scale(1.55);box-shadow:0 0 18px rgba(255,190,100,.85)}
#beatDots i.down{background:rgba(190,215,255,.55)}
#metaLine{position:relative;display:inline-block;margin-top:16px;padding:5px 12px;font-size:12px;
  letter-spacing:.13em;color:#a9b8e4;text-transform:uppercase;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;box-sizing:border-box;
  border-radius:8px;background:rgba(6,8,20,.62);box-shadow:0 0 0 1px rgba(130,165,255,.12)}
#metaLine::before{content:"";position:absolute;inset:-1px;border-radius:inherit;
  background:radial-gradient(120% 160% at 0% 50%,rgba(6,8,20,.96),rgba(6,8,20,.72) 62%,rgba(6,8,20,0));
  z-index:-1}

#kit{position:absolute;inset:0;width:100%;height:100%;display:block}
#kitTitle{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:11px;letter-spacing:.34em;
  color:#b9c8f0;text-transform:uppercase;pointer-events:none;
  text-shadow:0 1px 12px rgba(10,14,34,.95),0 0 2px rgba(10,14,34,.9)}
#kit .pc{transform-box:fill-box;transform-origin:50% 50%}
/* struck pieces squash about their own centre, not the view-box origin (200,280) */
#kit .hit{transform-box:fill-box;transform-origin:50% 50%}
#kit .hit.headTop{transform-origin:50% 22%}
#kit .hit.tomHead{transform-origin:50% 14%}
#kit #pcBeater{transform-box:fill-box;transform-origin:50% 100%}  /* beater pivots at the pedal, not the view-box */
/* struck piece squashes about its own centre, not the view-box origin (200,280) */
#kit .hitPiece{transform-box:fill-box;transform-origin:50% 50%}
#kit .hitPiece.headTop{transform-origin:50% 22%}
#kit .hitPiece.tomHead{transform-origin:50% 14%}
/* ambient idle drift on a separate wrapper layer, so a real hit always composites on top of it */
#kit .idleA,#kit .idleB,#kit .idleC,#kit .idleTomA,#kit .idleTomB,#kit .idleTomC{transform-box:fill-box;transform-origin:50% 50%}
#kit .idleA{animation:idleSwayA 4.7s ease-in-out infinite -2.1s}
#kit .idleB{animation:idleSwayB 6.1s ease-in-out infinite -4.4s}
#kit .idleC{animation:idleSwayC 7.3s ease-in-out infinite -1.3s}
#kit .idleTomA{animation:idleDriftA 5.3s ease-in-out infinite -1.6s}
#kit .idleTomB{animation:idleDriftB 8.1s ease-in-out infinite -3.2s}
#kit .idleTomC{animation:idleDriftC 6.7s ease-in-out infinite -0.9s}
@keyframes idleSwayA{0%,100%{transform:translate(0px,0px) rotate(-0.32deg)}50%{transform:translate(0.5px,-1px) rotate(0.34deg)}}
@keyframes idleSwayB{0%,100%{transform:translate(0.5px,0px) rotate(0.26deg)}50%{transform:translate(-0.5px,-0.8px) rotate(-0.22deg)}}
@keyframes idleSwayC{0%,100%{transform:translate(-0.4px,-0.3px) rotate(0.30deg)}50%{transform:translate(0.6px,0.6px) rotate(-0.20deg)}}
@keyframes idleDriftA{0%,100%{transform:translateY(0.9px)}50%{transform:translateY(-0.9px)}}
@keyframes idleDriftB{0%,100%{transform:translateY(-0.8px)}50%{transform:translateY(0.8px)}}
@keyframes idleDriftC{0%,100%{transform:translateY(0.7px)}50%{transform:translateY(-0.7px)}}
@media (prefers-reduced-motion:reduce){#kit .idleA,#kit .idleB,#kit .idleC,#kit .idleTomA,#kit .idleTomB,#kit .idleTomC{animation:none}}
#kit .rp{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
#kit .stickLine{transform-box:fill-box;transform-origin:50% 0%}
#kitBloom{opacity:0}
#kitShimmer{opacity:0}
.kglow{opacity:0;transition:opacity .07s linear}

/* ------- transport ------- */
button,select,input{font-family:inherit}
.tbtn{background:rgba(255,255,255,.05);border:1px solid rgba(140,175,255,.20);color:#dbe4ff;
  width:36px;height:36px;border-radius:10px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,transform .08s;flex:0 0 auto}
.tbtn:hover{background:rgba(150,180,255,.16);border-color:rgba(160,195,255,.42)}
.tbtn:active{transform:scale(.94)}
#btnPlay{background:linear-gradient(180deg,#ffd489,#e79a2c);border:none;color:#26170a;font-weight:800;font-size:15px}
#btnPlay:hover{filter:brightness(1.08)}
#seekWrap{flex:1 1 auto;min-width:60px;height:34px;display:flex;align-items:center;cursor:pointer;position:relative}
#seekBg{position:relative;width:100%;height:6px;border-radius:4px;background:rgba(160,190,255,.14);overflow:visible}
#seekFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;
  background:linear-gradient(90deg,#5fd0ff,#ffc46e);box-shadow:0 0 14px rgba(255,180,90,.5)}
#seekHead{position:absolute;top:50%;left:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
  background:#fff3d6;transform:translateY(-50%);box-shadow:0 0 14px rgba(255,200,120,.85)}
#seekTicks{position:absolute;inset:0;pointer-events:none}
#seekTicks b{position:absolute;top:-6px;width:1px;height:18px;background:rgba(150,180,255,.30)}
#seekTicks b.maj{background:rgba(255,190,110,.55);height:22px;top:-8px}
.tlab{font-size:11px;color:#8494c4;white-space:nowrap;letter-spacing:.05em}
#time{font-variant-numeric:tabular-nums;font-size:12.5px;color:#c3cdf0;white-space:nowrap;min-width:104px;text-align:center}
select{background:rgba(255,255,255,.05);border:1px solid rgba(140,175,255,.20);color:#dbe4ff;border-radius:9px;
  padding:6px 7px;font-size:12px;cursor:pointer;flex:0 0 auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:88px;height:20px;background:transparent;cursor:pointer;flex:0 0 auto}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:rgba(160,190,255,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#ffd489;margin-top:-4.5px;box-shadow:0 0 10px rgba(255,190,110,.7)}
.tog{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#93a2cf;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tog input{appearance:none;-webkit-appearance:none;width:32px;height:17px;border-radius:9px;background:rgba(160,190,255,.18);position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto}
.tog input:checked{background:linear-gradient(90deg,#5fd0ff,#ffc46e)}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#eef2ff;transition:transform .15s}
.tog input:checked::after{transform:translateX(15px)}
#srcLink{font-size:11.5px;color:#7fa6dd;text-decoration:none;border-bottom:1px dotted rgba(127,166,221,.5);white-space:nowrap;flex:0 0 auto}
#srcLink:hover{color:#bcd6ff}
#stamp{font-size:10px;color:#414c72;white-space:nowrap;flex:0 0 auto}

/* ------- overlay ------- */
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(900px 640px at 50% 42%,rgba(22,26,58,.62),rgba(4,5,14,.94) 72%),rgba(4,5,14,.86);
  backdrop-filter:blur(3px);cursor:pointer;transition:opacity .5s ease,visibility .5s}
#overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
#ovKicker{font-size:11.5px;letter-spacing:.5em;color:#7f8fc4;text-transform:uppercase;margin-bottom:18px}
#ovTitle{font-size:min(9.4vw,104px);font-weight:800;letter-spacing:.02em;line-height:1.02;text-align:center;
  background:linear-gradient(180deg,#ffffff,#cfd9ff 42%,#8f9ee0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 60px rgba(110,140,255,.35))}
#ovTitleEn{margin-top:10px;font-size:min(2.5vw,24px);letter-spacing:.26em;color:#c8b48c;text-transform:uppercase;text-align:center}
#ovArtist{margin-top:16px;font-size:15px;letter-spacing:.34em;color:#93a2cf;text-transform:uppercase}
#ovPlay{margin-top:46px;width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(160deg,#ffe3ae,#f0a63a 60%,#c87a17);color:#28180a;font-size:34px;
  display:flex;align-items:center;justify-content:center;padding-left:8px;
  box-shadow:0 0 0 1px rgba(255,220,160,.5),0 18px 60px rgba(255,170,70,.34),0 0 120px rgba(255,170,70,.22);
  animation:breathe 3.1s ease-in-out infinite}
#ovPlay:hover{filter:brightness(1.09)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
#ovSub{margin-top:30px;font-size:12.5px;color:#6e7cab;letter-spacing:.14em}
#ovSub b{color:#a9b8e4;font-weight:600}
#ovHint{margin-top:8px;font-size:11.5px;color:#586289;letter-spacing:.1em}
#ovBuild{position:absolute;bottom:14px;right:16px;font-size:10px;color:#3d476b;letter-spacing:.08em}
@media (max-width:1100px){#hud{max-width:70%}#chord{font-size:48px}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stars"></div><div id="stars2"></div><div id="stars3"></div>

<div id="app">
  <div id="pianoPane">
    <canvas id="roll"></canvas>
    <div id="rollFade"></div>
    <div id="hitGlow"></div>
    <canvas id="keys"></canvas>
    <div id="hud">
      <span id="secJp">イントロ</span>
      <span id="secEn">Intro</span>
      <div id="chordRow"><div id="chord">—</div><div id="chordQ"></div></div>
      <div id="beatDots"><i></i><i></i><i></i><i></i></div>
      <div id="metaLine">bar 1 · 116 BPM · 4/4</div>
    </div>
  </div>

  <div id="drumPane">
    <div id="kitTitle">Drums</div>
    <svg id="kit" viewBox="0 96 400 464" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <radialGradient id="gKick" cx="46%" cy="34%" r="70%">
          <stop offset="0%" stop-color="#33406b"/><stop offset="62%" stop-color="#161c33"/><stop offset="100%" stop-color="#080b17"/>
        </radialGradient>
        <radialGradient id="gHead" cx="42%" cy="30%" r="72%">
          <stop offset="0%" stop-color="#5f74ad" stop-opacity=".97"/><stop offset="62%" stop-color="#27314f" stop-opacity=".97"/><stop offset="100%" stop-color="#121834" stop-opacity="1"/>
        </radialGradient>
        <radialGradient id="gCym" cx="38%" cy="28%" r="76%">
          <stop offset="0%" stop-color="#a8f2ff"/><stop offset="46%" stop-color="#3fb6d8"/><stop offset="100%" stop-color="#135063"/>
        </radialGradient>
        <radialGradient id="gCym2" cx="34%" cy="26%" r="78%">
          <stop offset="0%" stop-color="#ffd9f4"/><stop offset="44%" stop-color="#c05fb4"/><stop offset="100%" stop-color="#5b1f5e"/>
        </radialGradient>
        <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9fb0d6"/><stop offset="100%" stop-color="#333d59"/>
        </linearGradient>
        <linearGradient id="gStick" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fff0c8"/><stop offset="100%" stop-color="#c9973f"/>
        </linearGradient>
        <radialGradient id="gBloom" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#8fe6ff" stop-opacity=".55"/><stop offset="60%" stop-color="#5a7dff" stop-opacity=".16"/><stop offset="100%" stop-color="#5a7dff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gShellSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0a0e1c"/><stop offset="16%" stop-color="#26325a"/><stop offset="50%" stop-color="#3a4a78"/><stop offset="86%" stop-color="#161d33"/><stop offset="100%" stop-color="#070a14"/>
        </linearGradient>
        <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e6efff" stop-opacity=".92"/><stop offset="45%" stop-color="#8aa6e6" stop-opacity=".42"/><stop offset="100%" stop-color="#42558c" stop-opacity=".06"/>
        </linearGradient>
        <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#01030a" stop-opacity=".62"/><stop offset="58%" stop-color="#01030a" stop-opacity=".30"/><stop offset="100%" stop-color="#01030a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gCymRing" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="66%" stop-color="#ffffff" stop-opacity="0"/><stop offset="86%" stop-color="#ffffff" stop-opacity=".5"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>

<ellipse id="kitBloom" cx="200" cy="330" rx="186" ry="216" fill="url(#gBloom)"/>
      <g id="kitShimmer" filter="url(#fSoft)" opacity="0">
        <ellipse cx="76" cy="150" rx="68" ry="20" fill="#8fe6ff" opacity=".5"/>
        <ellipse cx="322" cy="204" rx="62" ry="21" fill="#ffb0f0" opacity=".45"/>
      </g>

      <!-- ============ back layer: stands (drawn behind everything) ============ -->
      <g stroke="url(#gMetal)" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9">
        <path d="M146 532 L146 344"/>
        <path d="M146 360 L128 196 L130 152"/>
        <path d="M146 532 L118 540"/>
        <path d="M146 532 L172 540"/>
        <path d="M366 534 L366 336"/>
        <path d="M362 356 L330 214"/>
        <path d="M366 534 L342 540"/>
        <path d="M366 534 L390 540"/>
        <path d="M74 344 L74 512"/>
        <path d="M74 512 L48 540"/>
        <path d="M74 512 L100 540"/>
        <path d="M74 512 L74 540"/>
        <path d="M270 332 L270 190 L196 234"/>
        <path d="M270 246 L286 296"/>
      </g>
      <g fill="url(#gMetal)" opacity=".9">

      </g>

      <!-- ============ floor tom ============ -->
      <g class="idleTomC">
      <g id="pcTomLow" class="hitPiece tomHead">
        <path d="M294 460 L296 520"/><path d="M382 460 L380 520"/>
        <path d="M382 454 L382 522 Q338 542 294 522 L294 454 Q338 476 382 454 Z" fill="url(#gShellSide)" stroke="#5f76ad" stroke-opacity=".34"/>

      <!-- ============ rack toms (shells behind the kick) ============ -->

      <g class="idleTomB">
      <g id="pcTomMid" class="hitPiece tomHead">
        <path d="M234 298 L238 392 Q286 412 334 392 L338 298 Q286 324 234 298 Z" fill="url(#gShellSide)" stroke="#5f76ad" stroke-opacity=".34"/>
        <path d="M235 299 Q286 324 337 299" fill="none" stroke="url(#gRim)" stroke-width="2.6" opacity=".8"/>
        <ellipse cx="286" cy="296" rx="52" ry="17" fill="url(#gHead)" stroke="#8fb0e8" stroke-opacity=".44"/>
        <ellipse cx="277" cy="290" rx="28" ry="8" fill="#e9f1ff" opacity=".09"/>

      </g>
      </g>

      <!-- ============ bass drum ============ -->
      <g id="pcKick" class="hitPiece">
        <circle cx="264" cy="448" r="86" fill="url(#gKick)" stroke="url(#gRim)" stroke-width="3"/>

var BUILD_STAMP = window["__BUILD_STAMP__"] || "";

/* =====================================================================
   1. CONFIG + SCORE GUARDS
   ===================================================================== */
var CFG = {
  pxPerSec: 152,        // roll scroll speed
  lookahead: 0.12,      // AUDIO scheduling lookahead only (seconds)
  schedTick: 25,        // ms
  rollLookback: 12,     // seconds of already-started notes still drawn
  masterVol: 0.85
};

function isNum(v){ return typeof v === 'number' && isFinite(v); }
function nnum(v,d){ v = +v; return isFinite(v) ? v : d; }
function narr(v){ return Object.prototype.toString.call(v)==='[object Array]' ? v : []; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function bval(v){ return (v!==null && typeof v==='object') ? v.t : v; }   // arrays are either {t:..} rows or raw numbers
function lowerBound(a,t){ var lo=0,hi=a.length; while(lo<hi){ var m=(lo+hi)>>1; if(bval(a[m]) < t) lo=m+1; else hi=m; } return lo; }
function upperBound(a,t){ var lo=0,hi=a.length; while(lo<hi){ var m=(lo+hi)>>1; if(bval(a[m]) <= t) lo=m+1; else hi=m; } return lo; }

function normPiano(a){
  var o=[],i,e;
  for(i=0;i<a.length;i++){ e=a[i]; if(!e) continue;
    var t=nnum(e.t,-1), n=nnum(e.n,-1); if(t<0||n<0) continue;
    var nn=Math.round(n); if(nn<21||nn>108) nn=clamp(nn,21,108);
    o.push({t:t, d:Math.max(0.03,nnum(e.d,0.4)), n:nn, v:clamp(nnum(e.v,0.8),0,1)});
  }
  o.sort(function(x,y){return x.t-y.t;});
  return o;
}
function normDrums(a){
  var o=[],i,e;
  for(i=0;i<a.length;i++){ e=a[i]; if(!e) continue;
    var t=nnum(e.t,-1); if(t<0) continue;
    var ins=String(e.i||'kick'); if(!SYNTH_DRUMS[ins]) ins='kick';
    o.push({t:t, i:ins, v:clamp(nnum(e.v,0.85),0,1)});
  }
  o.sort(function(x,y){return x.t-y.t;});
  return o;
}
function normChords(a){
  var o=[],i,e;
  for(i=0;i<a.length;i++){ e=a[i]; if(!e) continue;
    var t=nnum(e.t,-1); if(t<0) continue;
    o.push({t:t, d:Math.max(0.05,nnum(e.d,1.5)), sym:String(e.sym||''), root:nnum(e.root,0), q:String(e.q||'')});
  }
  o.sort(function(x,y){return x.t-y.t;});
  return o;
}
function normSections(a){
  var o=[],i,e;
  for(i=0;i<a.length;i++){ e=a[i]; if(!e) continue;
    var t=nnum(e.t,-1); if(t<0) continue;
    o.push({t:t, name:String(e.name||'—'), jp:String(e.jp||'')});
  }
  o.sort(function(x,y){return x.t-y.t;});
  return o;
}
function normTimes(a){
  var o=[],i; for(i=0;i<a.length;i++){ var t=nnum(a[i],-1); if(t>=0) o.push(t); }
  o.sort(function(x,y){return x-y;}); return o;
}
var SYNTH_DRUMS = {kick:1,snare:1,hatClosed:1,hatOpen:1,tomLow:1,tomMid:1,tomHigh:1,crash:1,ride:1};

var RAW = window.__SCORE__ || {};
var SONG = RAW.song || {};
var ST = {
  piano:    normPiano(narr(RAW.piano)),
  drums:    normDrums(narr(RAW.drums)),
  chords:   normChords(narr(RAW.chords)),
  sections: normSections(narr(RAW.sections)),
  beats:    normTimes(narr(RAW.beats)),
  downbeats:normTimes(narr(RAW.downbeats))
};
var SONG_INFO = {
  title:    SONG.title    || '八十八鍵の宇宙',
  titleRomaji: SONG.titleRomaji || '',
  titleEn:  SONG.titleEn  || 'The Universe of 88 Keys',
  artist:   SONG.artist   || 'Orangestar',
  videoId:  SONG.videoId  || 'BUzraSkcz4E',
  bpm:      nnum(SONG.bpm,116),
  key:      SONG.key      || 'G major',
  dur:      Math.max(1, nnum(SONG.durationSec, 0) || 0)
};
if(!SONG_INFO.dur || SONG_INFO.dur<1){
  var lastT = 0, k;
  for(k in ST){ var arr=ST[k], last = arr.length? (arr[arr.length-1].t||0) : 0; if(last>lastT) lastT=last; }
  SONG_INFO.dur = lastT>1 ? lastT+4 : 240;
}
if(!ST.beats.length){
  var spb = 60/SONG_INFO.bpm, n=Math.floor(SONG_INFO.dur/spb);
  for(var bi=0;bi<n;bi++) ST.beats.push(bi*spb);
  for(var dj=0;dj<ST.beats.length;dj+=4) ST.downbeats.push(ST.beats[dj]);
}
var DUR = SONG_INFO.dur;

/* =====================================================================
   Keyboard geometry: 88 keys, 52 whites across the pane width
   ===================================================================== */
var IS_BLACK_PC = [0,1,0,1,0,0,1,0,1,0,1,0];
var KEYS = [], NWHITE = 0, KEY_BY_MIDI = {};
(function(){
  var nw = 0;
  for(var m=21;m<=108;m++){
    var pc = m%12, black = !!IS_BLACK_PC[pc], k = {m:m, pc:pc, black:black};
    if(black){ k.xi = nw; } else { k.wi = nw; nw++; }
    KEYS.push(k); KEY_BY_MIDI[m]=k;
  }
  NWHITE = nw; // 52
})();
var PC_HUE = [265, 15, 40, 60, 95, 150, 172, 190, 205, 225, 245, 290];

var GEO = { w:0, h:0, ww:20, keyH:170, rollH:400, hitY:400, bw:12, noteH:9, noteHB:7 };

var elRoll = document.getElementById('roll');
var elKeys = document.getElementById('keys');
var elPane = document.getElementById('pianoPane');
var elBar  = document.getElementById('bar');
var ctxRoll = elRoll.getContext('2d');
var ctxKeys = elKeys.getContext('2d');
var DPR = 1;

function fitCanvas(cv, c, w, h){
  cv.width  = Math.max(1, Math.round(w*DPR));
  cv.height = Math.max(1, Math.round(h*DPR));
  cv.style.width = w+'px'; cv.style.height = h+'px';
  c.setTransform(DPR,0,0,DPR,0,0);
}
function layout(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  var pw = elPane.clientWidth, ph = elPane.clientHeight;
  if(pw<10||ph<10) return;
  GEO.keyH = clamp(Math.round(ph*0.27), 108, 240);
  GEO.rollH = ph - GEO.keyH;
  GEO.hitY = GEO.rollH;
  GEO.w = pw; GEO.h = ph;
  GEO.ww = pw / NWHITE;
  GEO.bw = GEO.ww * 0.62;
  GEO.noteH = clamp(GEO.ww*0.40, 4, 13);
  GEO.noteHB = Math.max(3.5, GEO.noteH*0.80);
  fitCanvas(elRoll, ctxRoll, pw, GEO.rollH);
  fitCanvas(elKeys, ctxKeys, pw, GEO.keyH);
  document.getElementById('rollFade').style.height = Math.round(GEO.rollH*0.42)+'px';
  document.getElementById('hitGlow').style.height = GEO.keyH+'px';
  document.getElementById('hitGlow').style.bottom = '0px';
}
function keyGeom(k){
  if(k.black){ var cx = k.xi*GEO.ww; return {x:cx-GEO.bw/2, w:GEO.bw, cx:cx}; }
  return {x:k.wi*GEO.ww, w:GEO.ww, cx:(k.wi+0.5)*GEO.ww};
}

/* =====================================================================
   2. AudioEngine — the ONLY clock
   ===================================================================== */
var AE = {
  _ctx:null, buffer:null, source:null, master:null, musicGain:null, synthBus:null,
  state:'idle', startedAt:0, pausedAt:0, rate:1, loadErr:null, loadMs:0,
  ensureCtx: function(){
    if(this._ctx) return this._ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    var c = new AC();
    this._ctx = c;
    this.master = c.createGain(); this.master.gain.value = CFG.masterVol;
    this.master.connect(c.destination);
    this.musicGain = c.createGain(); this.musicGain.gain.value = 1; this.musicGain.connect(this.master);
    this.synthBus = c.createGain(); this.synthBus.gain.value = 0; this.synthBus.connect(this.master);
    return c;
  },
  prepare: function(){                       // memoised: decode once, ever
    if(this.preparePromise) return this.preparePromise;
    this.prepared = true;                      // "decode kicked off" (kept for existing probes)
    var c = this.ensureCtx(); if(!c) return Promise.resolve(false);
    var t0 = (window.performance&&performance.now)?performance.now():Date.now();
    this.preparePromise = this.loadAudio().then(function(ok){
      AE.loadMs = ((window.performance&&performance.now)?performance.now():Date.now()) - t0;
      AE.loadSettled = true;
      return ok;
    });
    return this.preparePromise;
  },
  loadAudio: function(){
    if(!AUDIO_B64) return Promise.resolve(false);
    var c = this.ensureCtx(); if(!c) return Promise.resolve(false);
    var b64 = AUDIO_B64, bin;
    try { bin = atob(b64); } catch(e){ this.loadErr = 'atob: '+e.message; return Promise.resolve(false); }
    var u8 = new Uint8Array(bin.length), i;
    for(i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    var ab = u8.buffer;
    var self = this;
    return new Promise(function(res){
      var done = false;
      var to = setTimeout(function(){ if(!done){ done=true; self.loadErr='decode timeout'; res(false); } }, 30000);
      try {
        var p = c.decodeAudioData(ab, function(buf){ if(done)return; done=true; clearTimeout(to); self.buffer=buf; self.loadErr=null; res(true); },
                                      function(e){ if(done)return; done=true; clearTimeout(to); self.loadErr='decode: '+(e&&e.message||e); res(false); });
        if(p && p.then) p.then(function(buf){ if(done)return; done=true; clearTimeout(to); self.buffer=buf; self.loadErr=null; res(true); },
                               function(e){ if(done)return; done=true; clearTimeout(to); self.loadErr='decode: '+(e&&e.message||e); res(false); });
      } catch(e){ if(!done){ done=true; clearTimeout(to); self.loadErr='decode threw: '+e.message; res(false); } }
    });
  },
  // ctx time at which score time t happens
  ctxTimeFor: function(t){ return this.startedAt + t/this.rate; },
  playhead: function(){
    if(this.state==='playing'){
      var c = this._ctx; if(!c) return this.pausedAt;
      return (c.currentTime - this.startedAt) * this.rate;
    }
    return this.pausedAt;
  },
  _stopSource: function(){
    if(this.source){ try{ this.source.onended = null; this.source.stop(); }catch(e){} try{ this.source.disconnect(); }catch(e){} this.source=null; }
  },
  play: function(fromPrepare){
    var c = this.ensureCtx(); if(!c) return;
    if(c.state === 'suspended' && c.resume) { try{ c.resume(); }catch(e){} }
    if(this.state === 'playing' && this.source) return;      // already rolling with audio
    if(this.state === 'playing' && !this.source && !fromPrepare && this.buffer && !SE.forceSynthOnly) this.state = 'paused';
    if(this.state === 'playing' && !fromPrepare && !this.buffer && AUDIO_B64 && !SE.forceSynthOnly) this.state = 'paused';
    if(this.state === 'playing') return;
    // decode still in flight (or never started): defer the start instead of playing silence
    if(!this.buffer && AUDIO_B64 && !SE.forceSynthOnly && !this.loadSettled && !fromPrepare){
      if(!this.pendingPlay){
        this.pendingPlay = true;
        HUD.ovStatus('loading');
        var self0 = this;
        this.prepare().then(function(){
          self0.pendingPlay = false;
          HUD.ovStatus(AE.buffer ? 'loaded' : 'failed');
          AE.play(true); Update.setPlayIcon();
        });
      }
      return;                                                // do NOT claim to be playing
    }
    if(this.source) this._stopSource();
    var off = clamp(this.pausedAt, 0, DUR);
    var when = c.currentTime + 0.06;
    if(this.buffer && !SE.forceSynthOnly){
      try{
        var src = c.createBufferSource();
        src.buffer = this.buffer;
        src.playbackRate.value = this.rate;
        src.connect(this.musicGain);
        src.start(when, Math.min(off, Math.max(0,this.buffer.duration-0.02)));
        this.source = src;
        var self = this;
        src.onended = function(){ if(self.source===src && self.state==='playing'){ self.pause(); } };
      }catch(e){ this.source=null; }
    }
    this.startedAt = when - off/this.rate;
    this.state = 'playing';
    Sched.reset(off); Sched.start();
  },
  pause: function(){
    if(this.state !== 'playing') return;
    var p = this.playhead();
    this.pausedAt = clamp(p, 0, DUR);
    this._stopSource();
    SE.killAll();
    this.state = 'paused';
    Sched.stop();
  },
  toggle: function(){ if(this.state==='playing') this.pause(); else this.play(); },
  seek: function(t){
    t = clamp(t, 0, DUR);
    var wasPlaying = (this.state==='playing');
    this._stopSource(); SE.killAll(); Sched.stop();
    this.pausedAt = t;
    this.state = 'paused';
    Vis.reseed(t);
    if(wasPlaying) this.play(); else { Sched.reset(t); }
  },
  restart: function(){ this.seek(0); },
  setRate: function(r){
    var p = this.playhead();
    this.rate = r;
    if(this.source){ try{ this.source.playbackRate.value = r; }catch(e){} }
    if(this.state==='playing' && this._ctx) this.startedAt = this._ctx.currentTime - p/r;
    Sched.reset(p); Vis.reseed(p);
  },
  setVolume: function(v){ CFG.masterVol=v; if(this.master) this.master.gain.value=v; }
};

/* =====================================================================
   3. SynthEngine (fallback / "Hear transcription")
   ===================================================================== */
var SE = {
  on: false, forceSynthOnly: false, voices: [], noiseBuf: null, maxVoices: 220,
  ctx: function(){ return AE.ensureCtx(); },
  noise: function(c){
    if(!this.noiseBuf){
      var n = Math.floor(c.sampleRate*1.2), b = c.createBuffer(1,n,c.sampleRate), d = b.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = b;
    }
    return this.noiseBuf;
  },
  track: function(node, stopAt){
    this.voices.push({n:node, s:stopAt});
    if(this.voices.length > this.maxVoices){
      var v = this.voices.shift(); try{ v.n.stop(); }catch(e){}
    }
  },
  killAll: function(){
    for(var i=0;i<this.voices.length;i++){ try{ this.voices[i].n.stop(); }catch(e){} }
    this.voices.length = 0;
  },
  setOn: function(on){
    this.on = !!on;
    var c = this.ctx(); if(!c) return;
    var now = c.currentTime;
    AE.musicGain.gain.cancelScheduledValues(now);
    AE.musicGain.gain.setTargetAtTime(this.on ? 0 : 1, now, 0.02);
    AE.synthBus.gain.cancelScheduledValues(now);
    AE.synthBus.gain.setTargetAtTime(this.on ? 0.5 : 0, now, 0.02);
  },
  pianoNote: function(midi, when, vel, dur){
    var c = this.ctx(); if(!c) return;
    when = Math.max(when, c.currentTime + 0.005);
    var f = 440*Math.pow(2,(midi-69)/12);
    var reg = (midi-21)/87;
    var dec = clamp(3.0 - reg*1.7, 1.2, 3.0);
    var amp = clamp(vel,0.05,1) * 0.24 * (1 - reg*0.25);
    var out = c.createGain();
    out.gain.value = 0;
    var lp = c.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = clamp(4000 + reg*2000, 4000, 6000); lp.Q.value = 0.6;
    lp.connect(out); out.connect(AE.synthBus);
    var dests = [ [f, 'sine', 0], [f*1.0016, 'triangle', 2.5], [f*0.9987, 'sine', -3], [f*2.0, 'sine', 1.5] ];
    var i, osc, g;
    for(i=0;i<dests.length;i++){
      osc = c.createOscillator(); osc.type = dests[i][1]; osc.frequency.value = dests[i][0];
      osc.detune.value = dests[i][2];
      g = c.createGain(); g.gain.value = (i===3?0.16:(i===0?1:0.42))/1.6;
      osc.connect(g); g.connect(lp);
      var stopAt = when + dec + 0.15;
      try{ osc.start(when); osc.stop(stopAt); }catch(e){}
      this.track(osc, stopAt);
    }
    var a = out.gain;
    a.setValueAtTime(0, when);
    a.linearRampToValueAtTime(amp, when + 0.005);
    a.exponentialRampToValueAtTime(Math.max(0.0006, amp*0.28), when + 0.10);
    a.exponentialRampToValueAtTime(0.0004, when + dec);
    // hammer transient
    var ns = c.createBufferSource(); ns.buffer = this.noise(c);
    var bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = clamp(f*3.2, 300, 9000); bp.Q.value = 1.1;
    var ng = c.createGain();
    ng.gain.setValueAtTime(0, when);
    ng.gain.linearRampToValueAtTime(amp*0.5, when+0.002);
    ng.gain.exponentialRampToValueAtTime(0.0003, when+0.035);
    ns.connect(bp); bp.connect(ng); ng.connect(out);
    try{ ns.start(when); ns.stop(when+0.06); }catch(e){}
  },
  env: function(c, node, when, peak, attack, decay){
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when+attack);
    g.gain.exponentialRampToValueAtTime(0.0004, when+attack+decay);
    node.connect(g); return g;
  },
  drumHit: function(inst, when, vel){
    var c = this.ctx(); if(!c) return;
    when = Math.max(when, c.currentTime + 0.004);
    var v = clamp(vel,0.05,1);
    var i, osc, g, ns, f;
    if(inst==='kick'){
      osc = c.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(120, when);
      osc.frequency.exponentialRampToValueAtTime(45, when+0.085);
      g = this.env(c, osc, when, v*0.95, 0.004, 0.35); g.connect(AE.synthBus);
      try{ osc.start(when); osc.stop(when+0.42); }catch(e){}
      ns = c.createBufferSource(); ns.buffer = this.noise(c);
      var hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
      var cg = c.createGain();
      cg.gain.setValueAtTime(v*0.28, when); cg.gain.exponentialRampToValueAtTime(0.0004, when+0.02);
      ns.connect(hp); hp.connect(cg); cg.connect(AE.synthBus);
      try{ ns.start(when); ns.stop(when+0.05); }catch(e){}
    } else if(inst==='snare'){
      osc = c.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(190, when);
      g = this.env(c, osc, when, v*0.42, 0.002, 0.18); g.connect(AE.synthBus);
      try{ osc.start(when); osc.stop(when+0.24); }catch(e){}
      ns = c.createBufferSource(); ns.buffer = this.noise(c);
      var bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
      var ng = c.createGain();
      ng.gain.setValueAtTime(v*0.5, when); ng.gain.exponentialRampToValueAtTime(0.0004, when+0.18);
      ns.connect(bp); bp.connect(ng); ng.connect(AE.synthBus);
      try{ ns.start(when); ns.stop(when+0.22); }catch(e){}
    } else if(inst==='hatClosed' || inst==='hatOpen'){
      var dec = (inst==='hatOpen') ? 0.32 : 0.045;
      ns = c.createBufferSource(); ns.buffer = this.noise(c);
      var hp2 = c.createBiquadFilter(); hp2.type='highpass'; hp2.frequency.value = 7200;
      var g2 = c.createGain();
      g2.gain.setValueAtTime(v*0.30, when); g2.gain.exponentialRampToValueAtTime(0.0004, when+dec);
      ns.connect(hp2); hp2.connect(g2); g2.connect(AE.synthBus);
      try{ ns.start(when); ns.stop(when+dec+0.03); }catch(e){}
    } else if(inst==='tomLow'||inst==='tomMid'||inst==='tomHigh'){
      f = inst==='tomHigh'?220:(inst==='tomMid'?165:110);
      osc = c.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(f, when);
      osc.frequency.exponentialRampToValueAtTime(f*0.55, when+0.28);
      g = this.env(c, osc, when, v*0.62, 0.003, 0.34); g.connect(AE.synthBus);
      try{ osc.start(when); osc.stop(when+0.42); }catch(e){}
    } else if(inst==='crash' || inst==='ride'){
      var parts = inst==='crash' ? [1,1.32,1.61,2.03,2.47,3.01] : [1,1.41,1.93,2.61,3.4];
      var base = inst==='crash' ? 400 : 560;
      var dec2 = inst==='crash' ? 1.4 : 0.7;
      var bus = c.createGain(); bus.gain.value = clamp(v,0.05,1)*0.16;
      var hp3 = c.createBiquadFilter(); hp3.type='highpass'; hp3.frequency.value = inst==='crash'?4200:5200;
      bus.connect(hp3); hp3.connect(AE.synthBus);
      for(i=0;i<parts.length;i++){
        osc = c.createOscillator(); osc.type='square';
        osc.frequency.value = base*parts[i]; osc.detune.value = (i%2?7:-6);
        var gg = c.createGain(); gg.gain.value = 1/parts.length;
        osc.connect(gg); gg.connect(bus);
        var stopAt = when + dec2 + 0.1;
        try{ osc.start(when); osc.stop(stopAt); }catch(e){}
        this.track(osc, stopAt);
      }
      var g3 = c.createGain();
      g3.gain.setValueAtTime(1, when); g3.gain.exponentialRampToValueAtTime(0.0005, when+dec2);
      bus.disconnect(); bus.connect(g3); g3.connect(hp3);
      if(inst==='ride'){
        osc = c.createOscillator(); osc.type='triangle'; osc.frequency.value=1240;
        var pg = this.env(c, osc, when, v*0.16, 0.002, 0.5); pg.connect(AE.synthBus);
        try{ osc.start(when); osc.stop(when+0.6); }catch(e){}
      }
    }
  }
};

/* =====================================================================
   4. Scheduler — Chris Wilson lookahead (AUDIO ONLY)
   ===================================================================== */
var Sched = {
  timer:null,
  cur:{piano:0, drums:0},
  reset: function(t){
    this.cur.piano = lowerBound(ST.piano, t);
    this.cur.drums = lowerBound(ST.drums, t);
  },
  start: function(){ if(this.timer) return; var s=this; this.timer = setInterval(function(){ s.tick(); }, CFG.schedTick); this.tick(); },
  stop: function(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  tick: function(){
    if(AE.state !== 'playing') return;
    var ph = AE.playhead(), horizon = ph + CFG.lookahead, i, e, ct;
    if(SE.on){
      var a = ST.piano, cur = this.cur.piano;
      while(cur < a.length && a[cur].t < horizon){
        e = a[cur++];
        if(e.t < ph - 0.06) continue;
        ct = AE.ctxTimeFor(e.t);
        SE.pianoNote(e.n, ct, e.v, e.d);
      }
      this.cur.piano = cur;
      var b = ST.drums, cd = this.cur.drums;
      while(cd < b.length && b[cd].t < horizon){
        e = b[cd++];
        if(e.t < ph - 0.06) continue;
        SE.drumHit(e.i, AE.ctxTimeFor(e.t), e.v);
      }
      this.cur.drums = cd;
    } else {
      // audio buffer path: nothing to schedule, but keep cursors valid
      var a2 = ST.piano;
      i = this.cur.piano; while(i<a2.length && a2[i].t < horizon) i++; this.cur.piano = i;
      var b2 = ST.drums;
      i = this.cur.drums; while(i<b2.length && b2[i].t < horizon) i++; this.cur.drums = i;
    }
  }
};

/* =====================================================================
   5. Visual state + queue
   ===================================================================== */
var PianoVis = {
  press: new Float32Array(128),
  glow:  new Float32Array(128),
  hitCount: 0,
  hit: function(e){ this.press[e.n] = 1; this.glow[e.n] = 1; this.hitCount++; },
  activeAt: function(t){
    // re-seed: notes that are still sounding at time t
    var a = ST.piano, i0 = Math.max(0, lowerBound(a, t-8) - 8), i;
    this.press.fill(0); this.glow.fill(0);
    for(i=i0;i<a.length;i++){ var e=a[i]; if(e.t>t) break; if(e.t+e.d > t){ this.press[e.n]=0.85; this.glow[e.n]=0.5; } }
  },
  update: function(dt){
    for(var i=0;i<128;i++){
      if(this.press[i]>0){ this.press[i] -= dt*3.4; if(this.press[i]<0) this.press[i]=0; }
      if(this.glow[i]>0){ this.glow[i] -= dt*1.5; if(this.glow[i]<0) this.glow[i]=0; }
    }
  }
};

var Vis = {
  idx:{piano:0, drums:0},
  prev:0,
  seed: function(t){
    this.idx.piano = lowerBound(ST.piano, t);
    this.idx.drums = lowerBound(ST.drums, t);
    this.prev = t;
  },
  reseed: function(t){
    this.seed(t);
    PianoVis.activeAt(t);
    Kit.reset();
  },
  drain: function(ph){
    var prev = this.prev;
    if(ph < prev - 1e-6 || ph - prev > 0.45){ this.seed(ph); this.prev = ph; return; }
    var a = ST.piano, i = this.idx.piano;
    var lo = upperBound(a, prev); if(lo > i) i = lo;
    while(i < a.length && a[i].t <= ph){ PianoVis.hit(a[i]); i++; }
    this.idx.piano = i;
    var b = ST.drums, j = this.idx.drums;
    var lo2 = upperBound(b, prev); if(lo2 > j) j = lo2;
    while(j < b.length && b[j].t <= ph){ Kit.hitDrum(b[j].i, b[j].v); j++; }
    this.idx.drums = j;
    this.prev = ph;
  }
};

/* =====================================================================
   6a. Drum kit (SVG, WAAPI + CSS vars only)
   ===================================================================== */
var KIT = ['kick','snare','hat','tomHigh','tomMid','tomLow','crash','ride'];
var Kit = {
  nodes:{}, eng:{}, bloom:null, shimmer:null, sticks:{}, lastWrite:-1,
  init: function(){
    var svg = document.getElementById('kit');
    for(var i=0;i<KIT.length;i++){
      var n = KIT[i];
      this.nodes[n] = document.getElementById('pc' + n.charAt(0).toUpperCase() + n.slice(1));
      this.eng[n] = 0;
    }
    this.ripples = {
      kick: document.getElementById('kickRipple'), snare: document.getElementById('snareRipple'),
      hat: document.getElementById('hatRipple'), tomHigh: document.getElementById('tomHighRipple'),
      tomMid: document.getElementById('tomMidRipple'), tomLow: document.getElementById('tomLowRipple'),
      crash: document.getElementById('crashRipple'), ride: document.getElementById('rideRipple')
    };
    this.bloom = document.getElementById('kitBloom');
    this.shimmer = document.getElementById('kitShimmer');
    this.sticks.a = document.getElementById('stickA');
    this.sticks.b = document.getElementById('stickB');
    var A = this.sticks.a, B = this.sticks.b;
    A.style.transform = 'rotate(34deg)'; B.style.transform = 'rotate(-30deg)';
    this.haveWAAPI = !!(A && A.animate);
    this.src = {};
    for(var k in this.nodes) this.src[k] = this.nodes[k] ? this.nodes[k].cloneNode(true) : null;
  },
  _pulse: function(node, kf, dur){
    if(!node || !node.animate) return;
    try{ node.animate(kf, {duration:dur, easing:'ease-out'}); }catch(e){}
  },
  _hit: function(node, peak, dur){
    if(!node || !node.animate) return;
    try{
      node.animate([
        {transform:'scale(1)', offset:0, easing:'cubic-bezier(.06,.72,.24,1)'},
        {transform:'scale('+peak.toFixed(4)+')', offset:0.17},
        {transform:'scale(1)', offset:1}
      ], {duration:dur, easing:'linear'});
    }catch(e){}
  },
  _swing: function(node, angle, dur){
    if(!node || !node.animate) return;
    try{
      node.animate([
        {transform:'rotate(0deg)', offset:0, easing:'cubic-bezier(.06,.72,.24,1)'},
        {transform:'rotate('+angle+'deg)', offset:0.24},
        {transform:'rotate(0deg)', offset:1}
      ], {duration:dur, easing:'linear'});
    }catch(e){}
  },
  _ripple: function(name, dur, scale){
    var r = this.ripples[name]; if(!r || !r.animate) return;
    try{
      r.animate([{transform:'scale(0.35)', opacity:0.85},{transform:'scale('+(scale||1.25)+')', opacity:0}],
                {duration:dur, easing:'cubic-bezier(.2,.7,.3,1)'});
    }catch(e){}
  },
  _stick: function(which, angle, dur){
    var s = this.sticks[which]; if(!s || !s.animate) return;
    var base = which==='a' ? 34 : -30;
    try{ s.animate([{transform:'rotate('+base+'deg)'},{transform:'rotate('+angle+'deg)'},{transform:'rotate('+base+'deg)'}], {duration:dur, easing:'ease-out'}); }catch(e){}
  },
  hitDrum: function(inst, v){
    var map = {kick:'kick', snare:'snare', hatClosed:'hat', hatOpen:'hat', tomHigh:'tomHigh', tomMid:'tomMid', tomLow:'tomLow', crash:'crash', ride:'ride'};
    var n = map[inst] || 'kick';
    this.eng[n] = Math.min(1.35, this.eng[n] + (0.6 + v*0.7));
    var node = this.nodes[n];
    var amp = 0.6 + v*0.55;
    if(n==='kick'){
      // peak squash 1.120 (softest) .. 1.161 (hardest) about the drum's own centre
      this._hit(node, 1 + 0.075*(1+amp), 220);
      this._ripple('kick', 430, 1.55);
      this._swing(document.getElementById('pcBeater'), -44, 240);
      this._stick('a', 60, 150);
    } else if(n==='snare'){
      this._hit(node, 1 + 0.075*(1+amp), 180);
      this._ripple('snare', 350, 1.45);
      this._stick('a', 74, 130);
    } else if(n==='hat'){
      var d = inst==='hatOpen' ? 26 : 12;
      this._pulse(node, [{transform:'translateY(0px)'},{transform:'translateY('+d+'px) rotate(2.2deg)'},{transform:'translateY(0px)'}], inst==='hatOpen'?210:120);
      this._ripple('hat', 300, 1.3);
      this._stick('b', 58, 120);
    } else if(n==='crash' || n==='ride'){
      var ang = n==='crash' ? 5.2 : 2.6;
      this._pulse(node, [{transform:'rotate(0deg)'},{transform:'rotate('+ang+'deg)'},{transform:'rotate('+(-ang*0.55)+'deg)'},{transform:'rotate(0deg)'}], n==='crash'?620:380);
      this._ripple(n, n==='crash'?520:360, 1.4);
      this._stick('b', n==='crash'?80:66, 150);
      if(this.shimmer){
        try{ this.shimmer.animate([{opacity:0},{opacity:0.55*v},{opacity:0}], {duration:n==='crash'?520:340}); }catch(e){}
      }
    } else {
      this._hit(node, 1 + 0.055*(1+amp), 200);
      this._ripple(n, 330, 1.45);
      this._stick('a', 62, 130);
    }
    if(v > 0.82 && this.bloom){
      try{ this.bloom.animate([{opacity:0},{opacity:0.55},{opacity:0}], {duration:260, easing:'ease-out'}); }catch(e){}
    }
    if(this.shimmer && (n==='kick'||n==='snare') && v>0.9){
      try{ this.shimmer.animate([{opacity:0},{opacity:0.25},{opacity:0}], {duration:280}); }catch(e){}
    }
  },
  reset: function(){ for(var k in this.eng) this.eng[k]=0; this.lastWrite=-1; },
  update: function(dt){
    var i, ch=false, v;
    for(i=0;i<KIT.length;i++){ v=this.eng[KIT[i]]; if(v>0){ v-=dt*2.1; if(v<0)v=0; this.eng[KIT[i]]=v; ch=true; } }
    if(!ch && this.lastWrite<0) return;
    this.lastWrite = ch?1:-1;
    var svg = document.getElementById('kit');
    for(i=0;i<KIT.length;i++){
      var n=KIT[i], e=this.eng[n];
      svg.style.setProperty('--e-'+n, (Math.round(e*100)/100).toFixed(2));
    }
  }
};

/* =====================================================================
   6b. Renderer
   ===================================================================== */
function hslFor(midi, a, l){
  var pc = ((midi%12)+12)%12;
  return 'hsla(' + PC_HUE[pc] + ',88%,' + (l||70) + '%,' + a + ')';
}
var ROLL = { i0:0 };
var Renderer = {
  lastT:0, fps:0, frames:0, fpsAcc:0,
  drawRoll: function(ph){
    var c = ctxRoll, w = GEO.w, h = GEO.rollH, i, e, k, g;
    c.clearRect(0,0,w,h);
    // beat / bar gridlines
    var tTop = ph + h/CFG.pxPerSec;
    var bi = lowerBound(ST.beats, ph);
    c.lineWidth = 1;
    for(i=bi;i<ST.beats.length;i++){
      var bt = ST.beats[i]; if(bt>tTop) break;
      var y = Math.round(GEO.hitY - (bt-ph)*CFG.pxPerSec)+0.5;
      if(y<-2||y>h+2) continue;
      var isBar = ((i % 4) === 0);
      c.strokeStyle = isBar ? 'rgba(150,180,255,.16)' : 'rgba(150,180,255,.07)';
      c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke();
    }
    // notes
    var a = ST.piano;
    var start = Math.max(0, lowerBound(a, ph - CFG.rollLookback) - 48);
    var nh, x, y, hh, key, alpha, dur;
    for(i=start;i<a.length;i++){
      e = a[i]; if(e.t > tTop) break;
      key = KEY_BY_MIDI[e.n]; if(!key) continue;
      g = keyGeom(key);
      nh = key.black ? GEO.noteHB : GEO.noteH;
      dur = Math.max(0.06, e.d);
      hh = Math.max(nh, dur*CFG.pxPerSec);
      y = GEO.hitY - (e.t - ph)*CFG.pxPerSec - hh;
      if(y > h + 4) continue;
      alpha = clamp(1 - (e.t - ph)/ (h/CFG.pxPerSec) * 0.55, 0.30, 1) * (0.45 + 0.55*e.v);
      x = g.x + GEO.ww*0.13;
      var wdt = Math.max(2, GEO.ww*0.74);
      var rr = Math.min(nh*0.5, wdt*0.5);   // pill ends
      var ly = key.black ? 64 : 68;
      var tvel = (e.t - ph);
      if(tvel > 0 && tvel < 0.34 && hh > 2){   // motion trail on fast notes
        var tg = c.createLinearGradient(0, y - 16, 0, y + hh);
        tg.addColorStop(0, hslFor(e.n, 0, ly));
        tg.addColorStop(1, hslFor(e.n, alpha*0.30, ly));
        c.fillStyle = tg;
        roundRect(c, x, y - 15, wdt, hh + 15, rr);
        c.fill();
      }
      var ng = c.createLinearGradient(0, y, 0, y + hh);
      ng.addColorStop(0,    hslFor(e.n, alpha*0.62, ly - 22));
      ng.addColorStop(0.42, hslFor(e.n, alpha*0.97, ly + 5));
      ng.addColorStop(1,    hslFor(e.n, alpha*0.70, ly - 28));
      c.fillStyle = ng;
      roundRect(c, x, y, wdt, hh, rr);
      c.fill();
      c.fillStyle = 'rgba(255,255,255,'+(alpha*0.34)+')';
      roundRect(c, x + wdt*0.17, y + Math.min(1.4, hh*0.16), Math.max(1, wdt*0.66), Math.max(1, Math.min(1.5, hh*0.20)), 1);
      c.fill();
      c.strokeStyle = hslFor(e.n, alpha*0.55, ly + 24); c.lineWidth = 1;
      roundRect(c, x+0.5, y+0.5, Math.max(2,wdt-1), Math.max(1,hh-1), Math.max(1,rr-0.5));
      c.stroke();
      if(PianoVis.press[e.n] > 0.02){
        c.fillStyle = 'rgba(255,214,150,'+(0.30*PianoVis.press[e.n])+')';
        roundRect(c, x-1, y-1, wdt+2, hh+2, 3); c.fill();
      }
    }
    // hit line
    c.save();
    c.fillStyle = 'rgba(255,206,130,.10)';
    c.fillRect(0, h-16, w, 16);
    c.strokeStyle = 'rgba(255,214,150,.85)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0,h-1); c.lineTo(w,h-1); c.stroke();
    c.restore();
  },
  drawKeys: function(ph){
    var c = ctxKeys, w = GEO.w, h = GEO.keyH, i, k, g;
    c.clearRect(0,0,w,h);
    var grad = c.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#20263f'); grad.addColorStop(0.06,'#e9edfb'); grad.addColorStop(0.75,'#f6f8ff'); grad.addColorStop(1,'#c9d1e8');
    var kw = GEO.ww;
    // whites
    for(i=0;i<KEYS.length;i++){
      k = KEYS[i]; if(k.black) continue;
      g = keyGeom(k);
      var p = PianoVis.press[k.m], gl = PianoVis.glow[k.m];
      c.fillStyle = p>0.02 ? mixAmber(p) : grad;
      c.fillRect(g.x, 0, Math.max(1,kw-1), h);
      if(p>0.02){
        c.fillStyle = 'rgba(255,190,90,'+(0.55*p)+')';
        c.fillRect(g.x, h*0.55, Math.max(1,kw-1), h*0.45);
        c.fillStyle = 'rgba(255,225,170,'+(0.45*p)+')';
        c.fillRect(g.x, 0, Math.max(1,kw-1), h*0.22);
      }
      if(gl>0.02){
        c.fillStyle = 'rgba(255,205,120,'+(0.30*gl)+')';
        c.fillRect(g.x-2, -6, Math.max(1,kw+3), h+6);
      }
      c.strokeStyle = 'rgba(20,26,48,.55)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(Math.round(g.x+kw-1)+0.5,0); c.lineTo(Math.round(g.x+kw-1)+0.5,h); c.stroke();
    }
    // blacks
    for(i=0;i<KEYS.length;i++){
      k = KEYS[i]; if(!k.black) continue;
      g = keyGeom(k);
      var pb = PianoVis.press[k.m], gb = PianoVis.glow[k.m];
      var bh = h*0.62;
      var bg = c.createLinearGradient(0,0,0,bh);
      bg.addColorStop(0,'#0b0f1e'); bg.addColorStop(0.7,'#232b45'); bg.addColorStop(1,'#171d31');
      c.fillStyle = pb>0.02 ? mixAmber(pb, true) : bg;
      roundRect2(c, g.x, 0, g.w, bh, [0,0,3,3]);
      c.fill();
      if(gb>0.02){ c.fillStyle='rgba(255,200,110,'+(0.28*gb)+')'; roundRect2(c,g.x-2,0,g.w+4,bh+5,[0,0,4,4]); c.fill(); }
      c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=1; c.stroke();
    }
    // note names
    if(SHOW_NAMES){
      c.font = '600 9px -apple-system,Segoe UI,Roboto,sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      for(i=0;i<KEYS.length;i++){
        k = KEYS[i]; if(k.black) continue;
        var nm = NOTE_NAMES[k.pc] + (Math.floor(k.m/12)-1);
        g = keyGeom(k);
        c.fillStyle = (k.pc===0) ? 'rgba(40,60,120,.9)' : 'rgba(60,80,130,.5)';
        c.fillText(nm, g.cx, h-7);
      }
      c.textAlign='left';
    }
  },
  frame: function(nowMs){
    var now = nowMs/1000;
    var dt = Renderer.lastT ? Math.min(0.05, now-Renderer.lastT) : 0.016;
    Renderer.lastT = now;
    var ph = AE.playhead();
    Vis.drain(ph);
    PianoVis.update(dt);
    Kit.update(dt);
    Renderer.drawRoll(ph);
    Renderer.drawKeys(ph);
    HUD.update(ph);
    Update.playheadUI(ph);
    window.__DEBUG__ = {
      playhead: ph,
      ctxTime: AE._ctx ? AE._ctx.currentTime : null,
      startedAt: AE.startedAt,
      state: AE.state,
      frames: (window.__DEBUG__ ? window.__DEBUG__.frames : 0) + 1,
      fps: Renderer.fps,
      pianoHits: PianoVis.hitCount,
      synth: SE.on,
      audio: !!AE.buffer,
      bar: HUD.bar

  }
};
function roundRect(c,x,y,w,h,r){ r=Math.min(r,h/2,w/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function roundRect2(c,x,y,w,h,rs){ var r=rs[2]||0; c.beginPath(); c.moveTo(x,y); c.lineTo(x+w,y); c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h); c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r); c.closePath(); }
function mixAmber(p, dark){
  var l = dark ? (28 + 34*p) : (72 + 20*p);
  return 'hsl(' + (38 - 6*p) + ',92%,' + l + '%)';
}
var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var SHOW_NAMES = false;

/* =====================================================================
   6c. HUD
   ===================================================================== */
var HUD = {
  lastSec:-1, lastChord:-1, lastBeat:-1, bar:1, dots:null,
  init: function(){
    this.dots = document.getElementById('beatDots').getElementsByTagName('i');
    document.getElementById('ovTitle').textContent = SONG_INFO.title;
    document.getElementById('ovTitleEn').textContent = SONG_INFO.titleEn;
    document.getElementById('ovKicker').textContent = SONG_INFO.artist;
    this.ovStatus(AE.buffer ? 'loaded' : (AUDIO_B64 ? 'ready' : 'synth'));
    document.getElementById('stamp').textContent = BUILD_STAMP ? ('build ' + BUILD_STAMP) : '';
    document.getElementById('ovBuild').textContent = BUILD_STAMP ? ('build ' + BUILD_STAMP) : '';
    var meta = document.getElementById('metaLine');
    meta.textContent = 'bar 1 · beat 1 · ' + SONG_INFO.bpm.toFixed(1) + ' BPM · ' + SONG_INFO.key + ' · ' + SONG_INFO.titleRomaji;
  },
  ovStatus: function(kind){
    var tail = ' · ' + SONG_INFO.bpm.toFixed(1) + ' BPM · ' + SONG_INFO.key;
    var msg = kind==='loading' ? 'audio decoding…'
            : kind==='loaded'  ? 'audio loaded'
            : kind==='failed'  ? 'audio decode failed — using synth'
            : kind==='synth'   ? 'no embedded audio — synthesising the transcription'
            :                    'ready to play';
    document.getElementById('ovInfo').textContent = msg + (kind==='synth' ? '' : tail);
  },
  update: function(ph){
    var si = lowerBound(ST.sections, ph+1e-6) - 1;
    if(si >= 0 && si !== this.lastSec){
      this.lastSec = si;
      var s = ST.sections[si];
      document.getElementById('secJp').textContent = s.jp || s.name;
      document.getElementById('secEn').textContent = s.name;
    }
    var ci = lowerBound(ST.chords, ph+1e-6) - 1;
    if(ci !== this.lastChord){
      this.lastChord = ci;
      var ch = document.getElementById('chord'), q = document.getElementById('chordQ');
      if(ci>=0){ ch.textContent = ST.chords[ci].sym || '—'; q.textContent = ST.chords[ci].q || ''; }
      else { ch.textContent = '—'; q.textContent = ''; }
      ch.style.opacity = '0.35';
      setTimeout(function(){ ch.style.opacity = '1'; }, 40);
    }
    var dbi = lowerBound(ST.downbeats, ph+1e-6) - 1;
    this.bar = dbi+1;
    var bi = lowerBound(ST.beats, ph+1e-6) - 1;
    var inBar = bi - dbi*4;
    if(inBar < 0) inBar = 0; if(inBar > 3) inBar = 3;
    if(bi !== this.lastBeat || this.forceDots){
      this.lastBeat = bi; this.forceDots = false;
      for(var i=0;i<this.dots.length;i++){
        var on = (i === (inBar%4)) && bi>=0;
        var d = this.dots[i];
        if(on){ if(!d.className) d.className='on'; } else { if(d.className) d.className = (i===0?'down':''); }
      }
      var m = document.getElementById('metaLine');
      m.textContent = 'bar ' + Math.max(1,this.bar) + ' · beat ' + (Math.max(0,inBar)+1) + ' · ' + SONG_INFO.bpm.toFixed(1) + ' BPM · ' + SONG_INFO.key + ' · ' + SONG_INFO.titleRomaji;
    }
  }
};

function fmt(t){

  return m + ':' + (s<10?'0':'') + s;
}
var Update = {
  dragging:false, acc:0,
  playheadUI: function(ph){

    this.acc += 1;
    if(this.acc % 6 === 0 || this.dragging){
      elTime.textContent = fmt(ph) + ' / ' + fmt(DUR);
    }
  },
  setPlayIcon: function(){
    btnPlay.textContent = (AE.state==='playing') ? '❚❚' : '▶';
    document.getElementById('ovPlay').textContent = (AE.state==='playing') ? '❚❚' : '▶';
  },
  buildTicks: function(){
    var host = document.getElementById('seekTicks');
    host.innerHTML = '';
    for(var i=0;i<ST.sections.length;i++){
      var b = document.createElement('b');
      if(i%1===0) b.className = 'maj';
      b.style.left = clamp(ST.sections[i].t/DUR,0,1)*100 + '%';
      b.title = ST.sections[i].name;
      host.appendChild(b);
    }
  }
};
function seekFromEvent(ev){
  var r = elSeek.getBoundingClientRect();
  var x = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX) - r.left;
  AE.seek(clamp(x/r.width,0,1)*DUR);
  Update.setPlayIcon();
}
elSeek.addEventListener('pointerdown', function(ev){ Update.dragging=true; elSeek.setPointerCapture&&elSeek.setPointerCapture(ev.pointerId); seekFromEvent(ev); });
elSeek.addEventListener('pointermove', function(ev){ if(Update.dragging) seekFromEvent(ev); });
elSeek.addEventListener('pointerup', function(ev){ Update.dragging=false; });
elSeek.addEventListener('pointercancel', function(){ Update.dragging=false; });
window.addEventListener('mouseup', function(){ Update.dragging=false; });

btnPlay.addEventListener('click', function(){ AE.toggle(); Update.setPlayIcon(); });
document.getElementById('btnBack').addEventListener('click', function(){ AE.seek(AE.playhead()-5); Update.setPlayIcon(); });
document.getElementById('btnRestart').addEventListener('click', function(){ AE.restart(); if(AE.state!=='playing'){ } Update.setPlayIcon(); });
document.getElementById('vol').addEventListener('input', function(e){ AE.setVolume(+e.target.value); });
document.getElementById('rate').addEventListener('change', function(e){ AE.setRate(+e.target.value); });
document.getElementById('cbNames').addEventListener('change', function(e){ SHOW_NAMES = !!e.target.checked; });
document.getElementById('cbSynth').addEventListener('change', function(e){ SE.setOn(!!e.target.checked); });

var ov = document.getElementById('overlay');
function hideOverlay(){
  ov.classList.add('hide');
  setTimeout(function(){ ov.style.display='none'; }, 560);
}
function startFromGesture(){
  AE.ensureCtx();
  if(AE._ctx && AE._ctx.state === 'suspended' && AE._ctx.resume) { try{ AE._ctx.resume(); }catch(e){} }
  if(AE.state==='playing'){ hideOverlay(); return; }
  if(!AE.buffer && AUDIO_B64 && !SE.forceSynthOnly && !AE.loadSettled){
    HUD.ovStatus('loading');                                  // keep the curtain up: play() resumes it on decode
    AE.pendingPlay = true;
    AE.prepare().then(function(){
      AE.pendingPlay = false;
      HUD.ovStatus(AE.buffer ? 'loaded' : 'failed');
      AE.play(true); Update.setPlayIcon(); hideOverlay();
    });
    return;
  }
  AE.play();
  Update.setPlayIcon();
  hideOverlay();
}
ov.addEventListener('click', function(ev){ ev.preventDefault(); startFromGesture(); });
document.getElementById('ovPlay').addEventListener('click', function(ev){ ev.stopPropagation(); startFromGesture(); });

window.addEventListener('keydown', function(ev){
  var tag = (ev.target && ev.target.tagName) || '';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') { if(ev.code!=='Space') return; }
  if(ev.code === 'Space'){ ev.preventDefault(); if(ov.style.display!=='none' && AE.state!=='playing'){ startFromGesture(); } else { AE.toggle(); Update.setPlayIcon(); } }
  else if(ev.code === 'ArrowLeft'){ ev.preventDefault(); AE.seek(AE.playhead()-5); Update.setPlayIcon(); }
  else if(ev.code === 'ArrowRight'){ ev.preventDefault(); AE.seek(AE.playhead()+5); Update.setPlayIcon(); }
  else if(ev.key === 'r' || ev.key === 'R'){ AE.restart(); Update.setPlayIcon(); }
});
window.addEventListener('resize', function(){ layout(); });
if(window.ResizeObserver){ try{ new ResizeObserver(function(){ layout(); }).observe(elPane); }catch(e){} }

/* =====================================================================
   boot
   ===================================================================== */
function starfield(){
  function make(id, count, size, op, spread){
    var el = document.getElementById(id); if(!el) return;
    var sh = [], i, x, y;
    for(i=0;i<count;i++){
      x = Math.round(Math.random()*spread[0]); y = Math.round(Math.random()*spread[1]);
      sh.push(x+'px '+y+'px 0 '+(size*0.5)+'px rgba(214,226,255,'+op+')');
    }
    el.style.boxShadow = sh.join(',');
  }
  var W = Math.max(window.innerWidth, 2560), H = Math.max(window.innerHeight, 1440);
  make('stars',  150, 1.2, 0.55, [W,H]);
  make('stars2', 90,  1.8, 0.75, [W,H]);
  make('stars3', 26,  2.6, 0.9,  [W,H]);
}
function boot(){
  SE.forceSynthOnly = !AUDIO_B64;
  Kit.init();
  HUD.init();
  layout();
  starfield();
  Update.buildTicks();
  document.getElementById('cbSynth').checked = !AUDIO_B64;
  SE.setOn(!AUDIO_B64);
  if(!AUDIO_B64){
    document.getElementById('cbSynth').disabled = false;
    document.getElementById('ovInfo').textContent = 'no embedded audio — synthesising the transcription';
  } else {
    HUD.ovStatus('loading');                                  // decode now; needs no gesture
    AE.prepare().then(function(ok){ HUD.ovStatus(ok ? 'loaded' : 'failed'); });
  }
  Vis.seed(0);
  window.__DEBUG__ = { playhead:0, ctxTime:null, startedAt:0, state:'idle', frames:0, fps:0, pianoHits:0, synth:SE.on, audio:false, bar:1 };
  window.__AE__ = AE; window.__SE__ = SE; window.__ST__ = ST; window.__KIT__ = Kit; window.__GEO__ = GEO;
  requestAnimationFrame(Renderer.frame);
  // fps meter
  var f0 = 0, n = 0;
  setInterval(function(){
    var d = (window.__DEBUG__ && window.__DEBUG__.frames) || 0;
    Renderer.fps = d - f0; f0 = d;
  }, 1000);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
